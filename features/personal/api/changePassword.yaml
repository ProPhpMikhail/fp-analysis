path:
    post:
        tags:
            - Personal
        summary: Изменение пароля
        description: Запрос изменения пароля
        operationId: changePassword
        security:
            - JWT: []
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/schemas/ChangePasswordRequest'
                    examples:
                        default:
                            summary: Пример запроса
                            value:
                                password: 'password123'
                                newPassword: 'password321'
        responses:
            204:
                description: Успешный ответ
            401:
                description: Unauthorized
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/api/schemas.yaml#/schemas/ErrorResponse'
                        examples:
                            unauthorized:
                                $ref: '../../../shared/api/examples.yaml#/examples/unauthorized'
                            invalid_credentials:
                                $ref: './examples.yaml#/examples/invalid_credentials'

            409:
                description: Бизнес ошибка
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/api/schemas.yaml#/schemas/ErrorResponse'
                        examples:
                            email_not_confirmed:
                                $ref: './examples.yaml#/examples/email_not_confirmed'
            400:
                description: Ошибка валидации
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/api/schemas.yaml#/schemas/ValidationErrorResponse'
                        examples:
                            validation_error:
                                $ref: '../../../shared/api/examples.yaml#/examples/validation_error'

            404:
                description: Пользователь не найден
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/api/schemas.yaml#/schemas/ErrorResponse'
                        examples:
                            user_not_found:
                                $ref: '../../../shared/api/examples.yaml#/examples/user_not_found'

schemas:
    ChangePasswordRequest:
        type: object
        additionalProperties: false
        required:
            - password
            - newPassword
        properties:
            password:
                type: string
            newPassword:
                type: string