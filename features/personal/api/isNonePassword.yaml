path:
    get:
        tags:
            - Personal
        summary: Проверка пользователя на наличие пароля
        description: Принимает запрос на отправку кода
        operationId: isNonePassword
        security:
            - JWT: []

        responses:
            200:
                description: Ответ
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/api/schemas.yaml#/schemas/BooleanResponse'
                    examples:
                        default:
                            summary: Успешный ответ
                            value:
                                success: true
                                data: true


            '404':
                description: Пользователь не найден по email
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/api/schemas.yaml#/schemas/ErrorResponse'
                        examples:
                            user_not_found:
                                $ref: '../../../shared/api/examples.yaml#/examples/user_not_found'
